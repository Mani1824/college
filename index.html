<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perchly Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#5B3FD1; --indigo:#2A1B78; --pink:#FF8FA3; --lav:#F3F0FD;
    --ink:#2A1B78; --muted:#6B6880;
    --T: 3.4s;            /* total intro length */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#15112b; font-family:Poppins,system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    min-height:100vh; padding:16px; overflow:hidden;
  }

  /* ---------- phone shell (fixed 390x844, scaled to fit) ---------- */
  .stage{width:390px;height:844px;transform-origin:center;flex:none}
  .phone{
    position:relative; width:390px; height:844px; border-radius:54px; overflow:hidden;
    background:var(--lav); box-shadow:0 0 0 10px #0b0918, 0 30px 80px rgba(0,0,0,.55);
  }
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:50}
  .status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 52px;z-index:40;color:#fff;font:600 16px/1 -apple-system,system-ui,sans-serif}
  .status .icons{display:flex;gap:6px;align-items:center}

  /* ---------- background layers ---------- */
  .header{
    position:absolute; left:0; right:0; top:0; height:100%; background:var(--violet);
    border-bottom:4px solid var(--pink); z-index:5;
    animation:headerShrink var(--T) cubic-bezier(.7,0,.2,1) forwards;
  }
  @keyframes headerShrink{
    0%,52%{height:100%; border-bottom-width:0}
    80%,100%{height:250px; border-bottom-width:4px}
  }
  .blackout{position:absolute;inset:0;background:#000;z-index:6;animation:fadeOut var(--T) ease forwards}
  @keyframes fadeOut{0%,40%{opacity:1}58%,100%{opacity:0}}

  /* ---------- the logo ---------- */
  .logo{
    position:absolute; left:30px; top:86px; width:56px; height:42px; z-index:30;
    transform-origin:center;
    animation:logoFly var(--T) cubic-bezier(.65,0,.25,1) forwards;
  }
  /* centre of phone = (195,422); logo centre at rest = (58,107) -> offset (137,315) */
  @keyframes logoFly{
    0%   {transform:translate(137px,315px) scale(0) rotate(-12deg); opacity:0}
    14%  {transform:translate(137px,315px) scale(3.6) rotate(4deg); opacity:1}
    20%  {transform:translate(137px,315px) scale(3.1) rotate(0)}
    48%  {transform:translate(137px,315px) scale(3.1)}
    56%  {transform:translate(137px,300px) scale(3.3)}           /* little lift before take-off */
    82%  {transform:translate(0,0) scale(.92)}
    88%  {transform:translate(0,0) scale(1.06)}
    100% {transform:translate(0,0) scale(1)}
  }
  .logo svg{width:100%;height:100%;overflow:visible}
  .logo .body{fill:var(--indigo);stroke:var(--violet);stroke-width:4;animation:bodyTone var(--T) ease forwards}
  .logo .tail{fill:var(--indigo);stroke:var(--violet);stroke-width:4;stroke-linejoin:round;animation:bodyTone var(--T) ease forwards}
  .logo .leg{fill:var(--violet);animation:legTone var(--T) ease forwards}
  .logo .eyeIn{fill:var(--indigo);animation:eyeTone var(--T) ease forwards}
  .logo .perch{fill:var(--pink);stroke:var(--violet);stroke-width:3;animation:perchTone var(--T) ease forwards}
  @keyframes bodyTone{0%,56%{fill:var(--indigo);stroke:var(--violet)}80%,100%{fill:#fff;stroke:#fff}}
  @keyframes legTone{0%,56%{fill:var(--violet)}80%,100%{fill:#fff}}
  @keyframes eyeTone{0%,56%{fill:var(--indigo)}80%,100%{fill:#fff}}
  @keyframes perchTone{0%,56%{stroke:var(--violet)}80%,100%{stroke:var(--pink)}}
  /* wing flap + blink while the bird is centre stage */
  .logo .wing{transform-box:fill-box;transform-origin:30% 50%;animation:flap var(--T) ease-in-out forwards}
  @keyframes flap{
    0%,22%{transform:rotate(0)} 26%{transform:rotate(-22deg)} 30%{transform:rotate(0)}
    34%{transform:rotate(-22deg)} 38%,100%{transform:rotate(0)}
  }
  .logo .eye{transform-box:fill-box;transform-origin:center;animation:blink var(--T) linear forwards}
  @keyframes blink{0%,42%{transform:scaleY(1)}44%{transform:scaleY(.1)}46%,100%{transform:scaleY(1)}}
  /* soft glow pulse under the big logo */
  .glow{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,143,163,.35),rgba(91,63,209,0) 65%);z-index:7;
    animation:glow var(--T) ease forwards}
  @keyframes glow{0%,8%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1)}48%{opacity:.8;transform:scale(1.1)}58%,100%{opacity:0;transform:scale(1.4)}}

  /* ---------- OTP screen content ---------- */
  .content{position:absolute;inset:0;z-index:20}
  .rise{opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .d1{animation-delay:calc(var(--T) * .78)} .d2{animation-delay:calc(var(--T) * .82)}
  .d3{animation-delay:calc(var(--T) * .86)} .d4{animation-delay:calc(var(--T) * .89)}
  .d5{animation-delay:calc(var(--T) * .92)} .d6{animation-delay:calc(var(--T) * .95)}

  h1{position:absolute;left:24px;top:156px;color:#fff;font:700 27px/1.15 Poppins;letter-spacing:-.3px}
  .sub{position:absolute;left:24px;top:198px;color:rgba(255,255,255,.85);font:400 14px Poppins}
  .otp{position:absolute;left:24px;right:24px;top:278px;display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
  .otp div{height:54px;border-radius:13px;border:1.5px solid var(--violet);background:#fff;display:grid;place-items:center;font:600 22px Poppins;color:var(--ink);transition:border-color .2s}
  .otp div.empty{border-color:#E1DCF3}
  .otp div.cur{border-color:var(--violet);box-shadow:0 0 0 3px rgba(91,63,209,.15)}
  .resend{position:absolute;left:24px;right:24px;top:346px;display:flex;justify-content:space-between;font:400 13px Poppins;color:var(--muted)}
  .resend b{color:var(--violet);font-weight:600}
  .keys{position:absolute;left:24px;right:24px;top:378px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .keys button{height:51px;border:0;border-radius:15px;background:#fff;font:500 21px Poppins;color:var(--ink);cursor:pointer}
  .keys button:active{background:#E9E4FB}
  .keys .blank{visibility:hidden}
  .cta{position:absolute;left:24px;right:24px;top:722px;height:54px;border:0;border-radius:18px;background:var(--violet);color:#fff;font:600 16px Poppins;box-shadow:0 10px 24px rgba(91,63,209,.25);cursor:pointer}
  .foot{position:absolute;left:30px;right:30px;top:790px;text-align:center;font:400 11.5px/1.5 Poppins;color:var(--muted)}
  .home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#B9B5C9;z-index:40}

  /* ---------- controls ---------- */
  .controls{display:flex;gap:10px;flex:none}
  .controls button{font:500 14px Poppins;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
  .controls button:hover{background:rgba(255,255,255,.16)}

  @media (prefers-reduced-motion: reduce){ :root{--T:.01s} .rise{animation-duration:.01s} }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone" id="phone">
      <div class="island"></div>
      <div class="status"><span>9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.3-1.3A10.5 10.5 0 0 0 8 .3 10.5 10.5 0 0 0 .5 3.4l1.3 1.3A8.7 8.7 0 0 1 8 2.2zm0 3.7c1.4 0 2.7.5 3.6 1.4l1.3-1.3A7 7 0 0 0 8 4a7 7 0 0 0-4.9 2l1.3 1.3c.9-.9 2.2-1.4 3.6-1.4zM8 9.6l1.9-1.9a2.7 2.7 0 0 0-3.8 0z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><rect x="24.5" y="4.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".5"/></svg>
        </span>
      </div>

      <div class="header"></div>
      <div class="blackout"></div>
      <div class="glow"></div>

      <div class="content">
        <h1 class="rise d1">Enter the 6-digit OTP</h1>
        <p class="sub rise d1">Sent by SMS to +91 98490 41128</p>
        <div class="otp rise d2" id="otp"></div>
        <div class="resend rise d3"><span>Didn't get it?</span><b id="timer">Resend in 0:30</b></div>
        <div class="keys rise d4" id="keys"></div>
        <button class="cta rise d5">Verify and continue</button>
        <p class="foot rise d6">Your number keeps inspections, quotes and warranty in one place.</p>
      </div>

      <!-- Perchly bird -->
      <div class="logo" aria-label="Perchly">
        <svg viewBox="0 0 160 120">
          <path class="tail" d="M10 36 L60 56 L10 80 L24 58 Z"/>
          <rect class="leg" x="74" y="90" width="14" height="14" rx="2"/>
          <circle class="body" cx="90" cy="54" r="42"/>
          <ellipse class="wing" cx="74" cy="66" rx="21" ry="11" transform="rotate(-8 74 66)" fill="#FF8FA3"/>
          <g class="eye">
            <circle cx="108" cy="38" r="12" fill="#FF8FA3"/>
            <circle class="eyeIn" cx="108" cy="38" r="6.5"/>
            <circle cx="108" cy="38" r="3" fill="#FF8FA3"/>
          </g>
          <path d="M129 44 L152 52 L129 60 Z" fill="#FF8FA3"/>
          <rect class="perch" x="22" y="102" width="124" height="13" rx="6.5"/>
        </svg>
      </div>
      <div class="home"></div>
    </div>
  </div>

  <div class="controls">
    <button id="replay">↺ Replay intro</button>
    <button id="slow">Slow motion: off</button>
  </div>

<script>
  /* scale the 390x844 phone to fit any screen */
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min((innerWidth-32)/410, (innerHeight-90)/864, 1);
    stage.style.transform = `scale(${s})`;
    stage.style.margin = `${(844*s-844)/2}px ${(390*s-390)/2}px`;
  }
  addEventListener('resize', fit); fit();

  /* OTP boxes + keypad (works after the intro) */
  let code = [];
  const otp = document.getElementById('otp'), keys = document.getElementById('keys');
  function drawOtp(){
    otp.innerHTML = '';
    for(let i=0;i<6;i++){
      const d = document.createElement('div');
      d.textContent = code[i] ?? '';
      if(code[i]===undefined) d.className = i===code.length ? 'cur' : 'empty';
      otp.appendChild(d);
    }
  }
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
    const b = document.createElement('button');
    b.textContent = k;
    if(!k) b.className='blank';
    b.onclick = ()=>{ if(k==='⌫') code.pop(); else if(code.length<6) code.push(k); drawOtp(); };
    keys.appendChild(b);
  });

  /* resend countdown, starts when the screen is shown */
  let tick;
  function startTimer(){
    clearInterval(tick); let t = 30;
    const el = document.getElementById('timer');
    el.textContent = 'Resend in 0:30';
    tick = setInterval(()=>{ t--; el.textContent = t>0 ? `Resend in 0:${String(t).padStart(2,'0')}` : 'Resend OTP'; if(t<=0) clearInterval(tick); },1000);
  }

  function play(){
    code = ['4','8','2','1']; drawOtp();
    const phone = document.getElementById('phone');
    phone.querySelectorAll('*').forEach(el=>{ el.style.animation='none'; el.offsetHeight; el.style.animation=''; });
    const T = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--T'))*1000;
    setTimeout(startTimer, T*0.85);
  }
  document.getElementById('replay').onclick = play;

  let slow = false;
  document.getElementById('slow').onclick = e=>{
    slow = !slow;
    document.documentElement.style.setProperty('--T', slow ? '10s' : '3.4s');
    e.target.textContent = 'Slow motion: ' + (slow ? 'on' : 'off');
    play();
  };
  play();
</script>
</body>
</html>
